[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-coupon-ledger"
version = "1.0.0"
description = "本地可复用的跨机构服务券账本、分期关账与红冲服务（仅标准库）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
service-coupon-ledger = "ledger_service.cli:main"

[tool.setuptools.packages.find]
include = ["ledger_service*"]
